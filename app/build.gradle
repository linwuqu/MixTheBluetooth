apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def loadApiEnv = { String envName ->
    def envFile = rootProject.file("app/config/env.${envName}.properties")
    def envProps = new Properties()
    if (envFile.exists()) {
        envFile.withInputStream { envProps.load(it) }
    }
    return [name: envName, props: envProps]
}

def applyApiEnv = { target, String envFileName ->
    def env = loadApiEnv(envFileName)
    def envName = env.name
    def envProps = env.props
    target.buildConfigField "String", "API_ENV", "\"${envProps.getProperty("API_ENV", envName)}\""
    target.buildConfigField "String", "API_BASE_URL", "\"${envProps.getProperty("API_BASE_URL", "http://10.0.2.2:8080/")}\""
    target.buildConfigField "boolean", "API_DEBUG", "${envProps.getProperty("API_DEBUG", "true")}"
    target.buildConfigField "String", "API_REMOTE_NAME", "\"${envProps.getProperty("API_REMOTE_NAME", envName)}\""
    target.buildConfigField "boolean", "API_NETWORK_ENABLED", "${envProps.getProperty("API_NETWORK_ENABLED", "true")}"
}

android {
    compileSdk 33
    defaultConfig {
        applicationId "com.hc.mixthebluetooth"
        minSdkVersion 23
        targetSdkVersion 28
        versionCode 1
        versionName "1.4.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        debug {
            applyApiEnv(delegate, "dev")
        }
        release {
            applyApiEnv(delegate, "dev")
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.hc.mixthebluetooth'
    kotlinOptions {
        jvmTarget = '1.8'
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.6.1'
    implementation 'androidx.core:core-ktx:1.10.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation project(path: ':basiclibrary')
    implementation project(path: ':bluetoothlibrary')
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'me.zhouzhuo.zzhorizontalprogressbar:zz-horizontal-progressbar:1.1.0'
    implementation 'com.jeremyliao:live-event-bus-x:1.7.3'
    implementation project(path: ':guide')
    implementation 'com.github.Philjay:MPAndroidChart:v3.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'

}
