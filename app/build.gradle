apply plugin: 'com.android.application'

android {
    compileSdk 33
    defaultConfig {
        applicationId "com.hc.mixthebluetooth"
        minSdkVersion 23
        targetSdkVersion 28
        versionCode 1
        versionName "1.4.2"
        def envName = project.hasProperty("apiEnv") ? project.property("apiEnv").toString() : "mock"
        def envFile = rootProject.file("app/config/env.${envName}.properties")
        def envProps = new Properties()
        if (envFile.exists()) {
            envFile.withInputStream { envProps.load(it) }
        }
        buildConfigField "String", "API_ENV", "\"${envProps.getProperty("API_ENV", envName)}\""
        buildConfigField "String", "API_BASE_URL", "\"${envProps.getProperty("API_BASE_URL", "http://10.0.2.2:8080/")}\""
        buildConfigField "boolean", "USE_MOCK_API", envProps.getProperty("USE_MOCK_API", "true")
        buildFeatures {
            viewBinding true
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    namespace 'com.hc.mixthebluetooth'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.android.material:material:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation project(path: ':basiclibrary')
    implementation project(path: ':bluetoothlibrary')
    implementation 'androidx.recyclerview:recyclerview:1.3.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'me.zhouzhuo.zzhorizontalprogressbar:zz-horizontal-progressbar:1.1.0'
    implementation 'com.jeremyliao:live-event-bus-x:1.7.3'
    implementation project(path: ':guide')
    implementation 'com.github.Philjay:MPAndroidChart:v3.1.0'
    implementation 'androidx.cardview:cardview:1.0.0'

}
