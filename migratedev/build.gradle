plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'app.cash.sqldelight'
}

def migratedevApiBaseUrl = project.findProperty("MIGRATEDEV_API_BASE_URL") ?: "http://100.102.150.19:8080/"

android {
    namespace 'com.biosensor.migratedev'
    compileSdk 35

    defaultConfig {
        applicationId "com.biosensor.migratedev"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_BASE_URL", "\"${migratedevApiBaseUrl}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        compose true
    }
    sourceSets {
        debug.java.srcDir "$buildDir/generated/sqldelight/code/LocalDatabase/debug"
        release.java.srcDir "$buildDir/generated/sqldelight/code/LocalDatabase/release"
    }
}

sqldelight {
    databases {
        LocalDatabase {
            packageName = "com.biosensor.migratedev.database"
        }
    }
}

dependencies {

    implementation project(':bluetoothlibrary')
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.compose.material:material'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.0'
    implementation 'androidx.navigation:navigation-compose:2.9.8'
    implementation 'androidx.datastore:datastore-preferences:1.2.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'app.cash.sqldelight:android-driver:2.3.2'
    implementation 'com.google.crypto.tink:tink-android:1.23.0'
    implementation 'com.squareup.okio:okio:3.17.0'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'app.cash.sqldelight:sqlite-driver:2.3.2'
    testImplementation 'com.squareup.okio:okio-fakefilesystem:3.17.0'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test:core:1.5.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
